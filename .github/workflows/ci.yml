name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Test
        run: uv run pytest -W error -q

  wechat-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/wechat-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: integrations/wechat-bot/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Test nutrition adapter
        run: npm run test:nutrition
      - name: Test analysis compatibility
        run: npm run test:analysis

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build and inspect release packages
        run: uv run python scripts/build-release.py
      - name: Verify installed wheel outside the project
        run: uv run --no-project --with ./dist/wechat_nutrition_bot-1.2.0-py3-none-any.whl python scripts/smoke-installed.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*

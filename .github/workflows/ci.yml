name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -W error -q

  wechat-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/wechat-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: integrations/wechat-bot/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Test nutrition adapter
        run: npm run test:nutrition
      - name: Test analysis compatibility
        run: npm run test:analysis
